name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gộp thành một file HTML
        run: python3 tools/build.py --out dist

      # Cần bật Pages một lần bằng tay trước:
      #   Settings -> Pages -> Source: GitHub Actions
      # (GITHUB_TOKEN không có quyền tự tạo Pages site, nên enablement:true
      #  chỉ báo "Resource not accessible by integration".)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
